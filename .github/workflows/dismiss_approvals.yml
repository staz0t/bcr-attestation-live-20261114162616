name: Dismiss Stale PR Approvals
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  dismiss_approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Run the exact deployed BCR reviewer
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@d1c4eb730271188868ab8d934df3a1507c0b07eb
        with:
          token: ${{ secrets.BCR_PR_REVIEW_HELPER_TOKEN }}
          action-type: dismiss_approvals
