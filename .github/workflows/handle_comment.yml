name: Handle Comment Commands
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
jobs:
  handle-comment:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '@bazel-io ')
    runs-on: ubuntu-latest
    steps:
      - name: Run the exact deployed BCR reviewer
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@d1c4eb730271188868ab8d934df3a1507c0b07eb
        with:
          token: ${{ secrets.BCR_PR_REVIEW_HELPER_TOKEN }}
          action-type: handle_comment
